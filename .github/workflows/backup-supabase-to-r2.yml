name: Backup Supabase to Cloudflare R2

on:
  schedule:
    # 03:00 UTC every day — see https://crontab.guru/#0_3_*_*_*
    - cron: "0 3 * * *"
  workflow_dispatch:
    # Manual trigger from the Actions tab (useful for first run / testing)

# Prevent two backup runs from racing for the same bucket.
concurrency:
  group: supabase-r2-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install PostgreSQL 17 client tools
        run: |
          # Supabase runs Postgres 17 — pg_dump must be >= server version.
          # The default postgresql-client on Ubuntu 24.04 is v16, so we add the
          # official PGDG repo to get v17, then pin pg_dump on PATH.
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -s -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          # Put v17's binaries first on PATH so `pg_dump` resolves to v17.
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Configure AWS CLI credentials for Cloudflare R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          mkdir -p ~/.aws
          cat > ~/.aws/credentials <<EOF
          [r2]
          aws_access_key_id = ${R2_ACCESS_KEY_ID}
          aws_secret_access_key = ${R2_SECRET_ACCESS_KEY}
          EOF
          # Endpoint is derived from the account ID — stored as a secret so it
          # never appears in logs.
          echo "R2_ENDPOINT=https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" >> "$GITHUB_ENV"

      - name: Run backup
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ env.R2_ENDPOINT }}
          BACKUP_RETENTION_DAYS: "30"
        run: |
          bash scripts/backup-supabase-to-r2.sh

      - name: Upload backup log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backup-log
          path: /tmp/supabase-backup.log
          if-no-files-found: ignore
          retention-days: 7

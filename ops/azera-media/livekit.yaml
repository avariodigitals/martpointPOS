# Room server only. A separate, verified SIP service and compatible Africa's
# Talking trunk are required before enabling telephone calls through this host.
port: 7880
bind_addresses:
  - "0.0.0.0"
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  use_external_ip: true
logging:
  level: info
  json: true

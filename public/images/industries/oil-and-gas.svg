<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" fill="none">
<title>Connected downstream operations</title><desc>Illustration connecting a filling station, LPG cylinders and a fuel distribution depot with a central business record.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1000" y2="800" gradientUnits="userSpaceOnUse"><stop stop-color="#EBF1FF"/><stop offset="1" stop-color="#F8FAFC"/></linearGradient>
<linearGradient id="tank" x1="650" y1="300" x2="850" y2="420" gradientUnits="userSpaceOnUse"><stop stop-color="#FFF"/><stop offset="1" stop-color="#DDE7F8"/></linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" stroke="#0057FF" stroke-opacity=".06"/></pattern>
</defs>
<rect width="1000" height="800" rx="40" fill="url(#bg)"/><rect width="1000" height="800" rx="40" fill="url(#grid)"/>
<circle cx="500" cy="400" r="270" stroke="#B3CDFF" stroke-dasharray="6 12"/><circle cx="500" cy="400" r="182" stroke="#B3CDFF" stroke-opacity=".5"/>
<path d="M300 310L500 400L748 287M500 400L500 620" stroke="#0057FF" stroke-width="3" stroke-dasharray="7 9"/>

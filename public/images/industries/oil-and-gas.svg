<path d="M169 279L203 267L229 278V342L197 354L169 343Z" fill="white" stroke="#7C9ECD" stroke-width="2"/><path d="M197 290L220 282V307L197 315Z" fill="#0A0F1C"/><path d="M177 282L190 287V307L177 302Z" fill="#B3CDFF"/>
<path d="M227 287C249 278 252 301 246 317C242 329 248 335 258 329V291" stroke="#0A0F1C" stroke-width="5" stroke-linecap="round"/>
<path d="M278 312L312 300L338 311V375L306 387L278 376Z" fill="white" stroke="#7C9ECD" stroke-width="2"/><path d="M306 323L330 315V340L306 348Z" fill="#0A0F1C"/>
<text x="250" y="443" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#0A0F1C">Filling stations</text>

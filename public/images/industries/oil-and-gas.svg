<g stroke="#8EA9D3" stroke-width="2"><rect x="392" y="567" width="58" height="103" rx="22" fill="white"/><path d="M407 571V553H435V571"/><path d="M413 553V542H429V553"/><rect x="465" y="548" width="71" height="128" rx="27" fill="white"/><path d="M483 552V531H518V552"/><path d="M491 531V519H510V531"/><rect x="553" y="568" width="58" height="103" rx="22" fill="white"/><path d="M568 573V553H596V573"/><path d="M574 553V542H590V553"/></g>
<path d="M394 615H448M467 607H534M555 616H609" stroke="#0057FF" stroke-opacity=".7" stroke-width="12"/>
<text x="505" y="734" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#0A0F1C">LPG &amp; gas retail</text>
<!-- Central shared record -->
<rect x="418" y="336" width="164" height="128" rx="26" fill="#0A0F1C"/><path d="M461 373H539M461 394H516M461 415H529" stroke="white" stroke-width="6" stroke-linecap="round"/><circle cx="570" cy="347" r="16" fill="#14C38E"/><path d="M563 347L568 352L577 342" stroke="white" stroke-width="3" stroke-linecap="round"/>
<text x="500" y="91" font-family="Arial,sans-serif" font-size="18" letter-spacing="3" font-weight="700" text-anchor="middle" fill="#0057FF">ONE CONNECTED BUSINESS VIEW</text>
</svg>

<path d="M772 200V320C772 356 877 356 877 320V200" fill="url(#tank)" stroke="#8EA9D3" stroke-width="2"/>
<ellipse cx="824.5" cy="200" rx="52.5" ry="20" fill="white" stroke="#8EA9D3" stroke-width="2"/><path d="M777 260C802 277 849 277 872 260" stroke="#0057FF" stroke-opacity=".2" stroke-width="10"/>
<path d="M885 239V343M877 246H894M877 264H894M877 282H894M877 300H894M877 318H894" stroke="#8EA9D3" stroke-width="3"/>
